<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Badminton Finder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏸</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════
       ULTRA iOS LIQUID GLASS — Badminton Finder
       Based on iOS 18 Control Center material
    ══════════════════════════════════════════════ */
    :root {
      /* Canvas — deep frosted blue matching iOS wallpaper depth */
      --bg-from:   #b8cef5;
      --bg-mid:    #c8e6c9;
      --bg-to:     #fce4b8;

      /* Glass material layers (light → heavy) */
      --g0: rgba(255,255,255,0.08);   /* barely-there tint */
      --g1: rgba(255,255,255,0.18);   /* card base */
      --g2: rgba(255,255,255,0.28);   /* elevated card */
      --g3: rgba(255,255,255,0.45);   /* modal surface */
      --g4: rgba(255,255,255,0.72);   /* near-opaque widget */

      /* Specular rim — bright top edge like glass catching light */
      --rim:      rgba(255,255,255,0.90);
      --rim-side: rgba(255,255,255,0.55);
      --rim-bot:  rgba(255,255,255,0.20);

      /* Blur amounts */
      --blur-sm:  blur(16px) saturate(160%);
      --blur-md:  blur(24px) saturate(180%) brightness(1.04);
      --blur-lg:  blur(36px) saturate(200%) brightness(1.06);
      --blur-xl:  blur(48px) saturate(220%) brightness(1.08);

      /* Shadows — layered like iOS material */
      --sh0: 0 2px 8px rgba(0,0,0,0.06);
      --sh1: 0 4px 20px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
      --sh2: 0 8px 32px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
      --sh3: 0 20px 60px rgba(0,0,0,0.20), 0 4px 16px rgba(0,0,0,0.10);

      /* iOS system colours */
      --blue:   #1d6aff;
      --green:  #34c759;
      --red:    #ff3b30;
      --orange: #ff9f0a;
      --purple: #af52de;
      --teal:   #5ac8fa;
      --label:  #1c1c1e;
      --label2: rgba(60,60,67,0.60);
      --label3: rgba(60,60,67,0.36);
      --sep:    rgba(60,60,67,0.12);

      --r-sm: 14px;
      --r-md: 20px;
      --r-lg: 28px;
      --r-xl: 36px;
    }

    /* ─── RESET ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; max-width: 100%;
      overflow-x: hidden;
      font-family: 'Noto Sans Lao Looped', -apple-system, 'SF Pro Text', sans-serif;
      background: #d0def7;
      color: var(--label);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── ANIMATED WALLPAPER (iOS-style gradient orbs) ─── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse 100% 60% at 15% 0%,   rgba(100,149,255,0.55) 0%, transparent 55%),
        radial-gradient(ellipse 80%  70% at 85% 100%,  rgba(52,199,89,0.30)  0%, transparent 55%),
        radial-gradient(ellipse 70%  50% at 70% 20%,   rgba(255,159,10,0.22) 0%, transparent 50%),
        radial-gradient(ellipse 60%  80% at 20% 80%,   rgba(175,82,222,0.18) 0%, transparent 50%),
        linear-gradient(155deg, #c3d8ff 0%, #d4edda 45%, #fdecd0 100%);
      pointer-events: none;
    }

    /* ─── GLASS UTILITY ─── */
    .glass-sm {
      background: var(--g2);
      backdrop-filter: var(--blur-sm); -webkit-backdrop-filter: var(--blur-sm);
      border: 1px solid var(--rim-side);
      border-top-color: var(--rim);
      box-shadow: var(--sh1);
    }
    .glass-md {
      background: var(--g2);
      backdrop-filter: var(--blur-md); -webkit-backdrop-filter: var(--blur-md);
      border: 1px solid var(--rim-side);
      border-top-color: var(--rim);
      box-shadow: var(--sh2);
    }

    /* ═══════════════ TAB BAR ═══════════════ */
    #tabBar {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      z-index: 900;
      display: flex; align-items: stretch;
      background: rgba(220,232,255,0.70);
      backdrop-filter: var(--blur-lg); -webkit-backdrop-filter: var(--blur-lg);
      border-bottom: 1px solid rgba(255,255,255,0.50);
      box-shadow: 0 1px 0 rgba(255,255,255,0.60), var(--sh1);
    }
    .tab-btn {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 7px; font-size: 13px; font-weight: 600;
      color: var(--label2); background: none; border: none;
      border-bottom: 2.5px solid transparent; cursor: pointer;
      font-family: inherit; transition: color .18s, border-color .18s;
    }
    .tab-btn.active { color: var(--blue); border-color: var(--blue); }
    .tab-btn i { font-size: 15px; }

    /* ═══════════════ MAP ═══════════════ */
    #mapPage { position: fixed; inset: 56px 0 0 0; }
    #map { position: absolute; inset: 0; z-index: 1; }

    /* ─── FLOATING SEARCH ─── */
    .map-top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      z-index: 20; display: flex; gap: 10px; pointer-events: none;
    }
    .map-top-bar > * { pointer-events: auto; }

    /* Search pill — iOS pill shape */
    .search-pill {
      flex: 1; height: 50px; display: flex; align-items: center;
      gap: 10px; padding: 0 16px;
      background: rgba(255,255,255,0.65);
      backdrop-filter: var(--blur-lg); -webkit-backdrop-filter: var(--blur-lg);
      border: 1px solid var(--rim-side);
      border-top-color: var(--rim);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.80),
        0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
      border-radius: 99px;
    }
    .search-pill input {
      flex: 1; background: none; border: none; outline: none;
      font-family: inherit; font-size: 14px; color: var(--label);
    }
    .search-pill input::placeholder { color: var(--label3); }

    /* Menu button — rounded square like CC icon */
    .menu-btn {
      width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.55);
      backdrop-filter: var(--blur-lg); -webkit-backdrop-filter: var(--blur-lg);
      border: 1px solid var(--rim-side);
      border-top-color: var(--rim);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.80),
        0 8px 32px rgba(0,0,0,0.12);
      border-radius: 16px;
      color: var(--label); font-size: 17px; cursor: pointer;
    }
    .menu-btn:active { filter: brightness(.9); }

    /* ═══════════════ COURT CARDS (Ultra Liquid Glass) ═══════════════ */
    #courtList {
      position: absolute; bottom: 16px; left: 0; right: 0;
      z-index: 10; display: flex; gap: 12px;
      padding: 8px 16px; overflow-x: auto;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      pointer-events: none;
    }
    #courtList::-webkit-scrollbar { display: none; }

    .court-card {
      pointer-events: auto; flex-shrink: 0;
      min-width: 274px; max-width: 274px;
      padding: 16px 15px 13px;
      border-radius: var(--r-lg);
      cursor: pointer;
      /* Multi-layer glass stack */
      background:
        linear-gradient(
          160deg,
          rgba(255,255,255,0.72) 0%,
          rgba(255,255,255,0.42) 60%,
          rgba(255,255,255,0.28) 100%
        );
      backdrop-filter: blur(40px) saturate(220%) brightness(1.08);
      -webkit-backdrop-filter: blur(40px) saturate(220%) brightness(1.08);
      /* Specular rims */
      border-top: 1.5px solid rgba(255,255,255,0.95);
      border-left: 1px solid rgba(255,255,255,0.70);
      border-right: 1px solid rgba(255,255,255,0.45);
      border-bottom: 1px solid rgba(255,255,255,0.30);
      /* Layered shadows */
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.70),
        inset 0 -1px 0 rgba(0,0,0,0.04),
        0 16px 48px rgba(0,0,0,0.16),
        0 4px 12px rgba(0,0,0,0.08),
        0 1px 3px rgba(0,0,0,0.04);
      position: relative; overflow: hidden;
      transition: transform .2s cubic-bezier(.34,1.56,.64,1),
                  box-shadow .2s;
    }
    /* Top gloss sweep */
    .court-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 55%;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.36) 0%,
        rgba(255,255,255,0.08) 60%,
        rgba(255,255,255,0) 100%);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      pointer-events: none; z-index: 0;
    }
    /* Subtle inner edge highlight */
    .court-card::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: var(--r-lg);
      background: linear-gradient(145deg,
        rgba(255,255,255,0.12) 0%,
        rgba(255,255,255,0) 50%,
        rgba(0,0,0,0.02) 100%);
      pointer-events: none; z-index: 0;
    }
    .court-card > * { position: relative; z-index: 1; }
    .court-card:active {
      transform: scale(0.96);
      box-shadow: 0 6px 20px rgba(0,0,0,0.14), 0 2px 6px rgba(0,0,0,0.08);
    }
    .court-card h3 {
      font-size: 14px; font-weight: 700; margin: 0 0 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: rgba(28,28,30,0.92);
    }
    .court-card .loc {
      font-size: 11px; color: var(--label2);
      display: flex; align-items: center; gap: 4px; margin: 0 0 11px;
    }
    .cc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .cc-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 5px; padding: 9px 4px;
      border-radius: 12px; border: none; cursor: pointer;
      font-family: inherit; font-size: 12px; font-weight: 600;
      text-decoration: none;
      /* Glass tinted buttons */
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.50);
      transition: filter .15s, transform .1s;
    }
    .cc-btn:active { filter: brightness(.88); transform: scale(.96); }
    .cc-call  { background: rgba(255,59,48,0.15);  color: var(--red);    border-color: rgba(255,59,48,0.20); }
    .cc-chat  { background: rgba(52,199,89,0.14);  color: #1a8f3a;       border-color: rgba(52,199,89,0.20); }
    .cc-map   { background: rgba(29,106,255,0.13); color: var(--blue);   border-color: rgba(29,106,255,0.20); }
    .cc-share { background: rgba(255,159,10,0.13); color: #b86200;       border-color: rgba(255,159,10,0.20); }

    /* ═══════════════ FABs (Control Center style) ═══════════════ */
    .fab-col {
      position: absolute; right: 12px; bottom: 196px;
      z-index: 20; display: flex; flex-direction: column; gap: 10px;
    }
    .fab {
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; border: none; cursor: pointer;
      font-family: inherit; font-size: 17px; color: #fff;
      text-decoration: none;
      /* Liquid Glass FAB */
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.55);
      border-top-color: rgba(255,255,255,0.90);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.65),
        0 8px 24px rgba(0,0,0,0.22),
        0 2px 6px rgba(0,0,0,0.12);
      transition: transform .15s cubic-bezier(.34,1.56,.64,1);
    }
    .fab:active { transform: scale(.88); }
    .fab-loc    { background: linear-gradient(145deg, rgba(90,165,255,0.85), rgba(29,106,255,0.90)); }
    .fab-wa1    { background: linear-gradient(145deg, rgba(72,220,120,0.85), rgba(37,168,96,0.90)); }
    .fab-wa2    { background: linear-gradient(145deg, rgba(52,199,89,0.85),  rgba(22,140,60,0.90)); }
    .fab-admin  { background: linear-gradient(145deg, rgba(90,165,255,0.85), rgba(29,106,255,0.90)); font-size: 10px; font-weight: 800; }
    .fab-donate { background: linear-gradient(145deg, rgba(255,185,50,0.88), rgba(200,120,10,0.90)); }

    /* ═══════════════ SIDEBAR ═══════════════ */
    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 290px;
      z-index: 3000; padding: 28px 22px;
      background: rgba(220,232,255,0.82);
      backdrop-filter: var(--blur-xl); -webkit-backdrop-filter: var(--blur-xl);
      border-right: 1px solid rgba(255,255,255,0.55);
      box-shadow: var(--sh3);
      transform: translateX(-100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    #sidebar.open { transform: translateX(0); }
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      z-index: 2500;
    }
    #overlay.show { display: block; }
    .sb-title {
      font-size: 17px; font-weight: 700; color: var(--label);
      margin: 0 0 22px; display: flex; justify-content: space-between; align-items: center;
    }
    .sb-close {
      width: 30px; height: 30px; border-radius: 50%;
      border: none; background: rgba(120,120,128,0.16);
      color: var(--label2); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }
    .f-label {
      font-size: 10px; font-weight: 700; color: var(--label2);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px;
    }
    .f-select {
      width: 100%; padding: 11px 14px;
      border: 1px solid var(--rim-side); border-radius: var(--r-sm);
      font-family: inherit; font-size: 14px; color: var(--label);
      background: rgba(255,255,255,0.55); outline: none;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .btn-blue {
      width: 100%; padding: 14px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 99px;
      font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 16px rgba(29,106,255,.40), inset 0 1px 0 rgba(255,255,255,0.25);
      letter-spacing: 0.01em;
    }
    .btn-blue:active { filter: brightness(.88); }

    /* ═══════════════ POST PAGE ═══════════════ */
    #postPage {
      display: none; position: fixed; inset: 56px 0 0 0;
      overflow-y: auto; overflow-x: hidden;
      background: transparent; padding: 14px;
    }
    #postPage.active { display: block; }

    /* ─── GLASS CARD ─── */
    .g-card {
      /* Liquid glass card */
      background: linear-gradient(155deg,
        rgba(255,255,255,0.62) 0%,
        rgba(255,255,255,0.38) 100%);
      backdrop-filter: var(--blur-lg); -webkit-backdrop-filter: var(--blur-lg);
      border-top: 1.5px solid var(--rim);
      border-left: 1px solid rgba(255,255,255,0.65);
      border-right: 1px solid rgba(255,255,255,0.40);
      border-bottom: 1px solid rgba(255,255,255,0.25);
      border-radius: var(--r-lg);
      padding: 20px;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.55),
        var(--sh2);
      margin-bottom: 12px;
      width: 100%; max-width: 100%; overflow: hidden;
      position: relative;
    }
    /* Gloss sweep on cards */
    .g-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 40%;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 100%);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      pointer-events: none;
    }
    .g-card > * { position: relative; }
    .g-card-title {
      font-size: 15px; font-weight: 700; color: var(--label);
      margin: 0 0 16px; display: flex; align-items: center; gap: 8px;
    }
    .g-card-title i { color: var(--blue); }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .f-field { display: flex; flex-direction: column; }
    .f-field > label {
      font-size: 10px; font-weight: 700; color: var(--label2);
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px;
    }
    /* Glass inputs */
    .f-input {
      width: 100%;
      padding: 11px 13px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.60);
      border-top-color: rgba(255,255,255,0.80);
      border-bottom-color: rgba(60,60,67,0.12);
      border-radius: var(--r-sm);
      font-family: inherit; font-size: 14px; color: var(--label);
      outline: none;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: border-color .2s, box-shadow .2s;
      box-sizing: border-box;
    }
    .f-input:focus {
      border-color: rgba(29,106,255,0.50);
      box-shadow: 0 0 0 3px rgba(29,106,255,0.14);
      background: rgba(255,255,255,0.70);
    }
    .f-input::placeholder { color: var(--label3); }

    /* ─── RANGE LEVEL SELECTOR ─── */
    .level-label-row {
      font-size: 10px; font-weight: 700; color: var(--label2);
      text-transform: uppercase; letter-spacing: .05em;
      margin-bottom: 8px; display: flex; justify-content: space-between;
    }
    .level-label-row span {
      font-size: 11px; font-weight: 600; color: var(--blue);
      font-style: normal; text-transform: none; letter-spacing: 0;
    }
    .lv-rail {
      display: flex; gap: 6px; flex-wrap: nowrap;
      overflow-x: auto; scrollbar-width: none;
      padding-bottom: 2px; margin-bottom: 4px;
    }
    .lv-rail::-webkit-scrollbar { display: none; }
    .lv-chip {
      flex-shrink: 0; cursor: pointer; user-select: none;
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 9px 11px;
      border-radius: 14px;
      background: rgba(255,255,255,0.50);
      border: 1px solid rgba(255,255,255,0.65);
      border-top-color: rgba(255,255,255,0.90);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.60), var(--sh0);
      transition: all .15s cubic-bezier(.34,1.2,.64,1);
      min-width: 54px;
    }
    .lv-chip .lc-code { font-size: 12px; font-weight: 800; color: var(--label); }
    .lv-chip .lc-desc { font-size: 9px; color: var(--label2); text-align: center; line-height: 1.2; }
    .lv-chip.lv-in-range {
      background: rgba(29,106,255,0.14);
      border-color: rgba(29,106,255,0.30);
    }
    .lv-chip.lv-in-range .lc-code { color: var(--blue); }
    .lv-chip.lv-endpoint {
      background: var(--blue);
      border-color: rgba(29,106,255,0.80);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.30),
                  0 4px 14px rgba(29,106,255,0.45);
      transform: scale(1.05);
    }
    .lv-chip.lv-endpoint .lc-code,
    .lv-chip.lv-endpoint .lc-desc { color: #fff; }
    .lv-hint { font-size: 10px; color: var(--label3); margin-top: 3px; }

    /* ─── FEED GRID (2-col mobile, 3-col desktop) ─── */
    .feed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media(min-width:900px){ .feed-grid { grid-template-columns: repeat(3,1fr); } }

    /* ─── FEED HEADER ─── */
    .feed-hdr {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; padding: 0 2px;
    }
    .feed-hdr p {
      font-size: 13px; font-weight: 700;
      color: rgba(28,28,30,0.65); margin: 0;
    }
    .feed-hdr button {
      border: none; background: none; font-family: inherit;
      font-size: 12px; color: var(--blue); cursor: pointer; font-weight: 600;
    }

    /* ─── FEED CARD ─── */
    .feed-card { width: 100%; max-width: 100%; margin-bottom: 0; display: flex; flex-direction: column; }
    .feed-court-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 15px; font-weight: 700; color: var(--label);
      background: none; border: none; cursor: pointer;
      font-family: inherit; padding: 0; margin-bottom: 8px; text-align: left;
    }
    .feed-court-btn:hover { color: var(--blue); }
    .feed-meta {
      font-size: 12px; color: var(--label2);
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 9px;
    }
    .feed-meta span { display: flex; align-items: center; gap: 4px; }
    .feed-meta i { font-size: 10px; }
    .feed-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 11px; }
    .feed-actions { display: flex; gap: 8px; margin-top: auto; }

    /* WhatsApp button — glass tinted green */
    .wa-btn {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 7px; padding: 11px;
      background: rgba(52,199,89,0.16);
      border: 1px solid rgba(52,199,89,0.28);

<script>
'use strict';

/* ───────────────── STATE ───────────────── */
var map, userMarker;
var markers = [];          // Google Maps Marker array
var infoWindow = null;     // shared InfoWindow
var allCourts = [];
var currentShareData = null;
var selectedProvince = "ທັງໝົດ";
var cardElements = {};

/* ───────────────── LEVEL DATA ───────────────── */
var LEVELS = [
  { id:'BG',   code:'BG',   desc:'ເລີ່ມຕົ້ນ',   badgeCls:'lv-BG'   },
  { id:'BGPM', code:'BG+',  desc:'ສາຍໝົກ',    badgeCls:'lv-BGPM' },
  { id:'S-',   code:'S-',   desc:'ຢືນຕີ',     badgeCls:'lv-SM'   },
  { id:'S',    code:'S',    desc:'Step ດີ',  badgeCls:'lv-S'    },
  { id:'SN',   code:'SN',   desc:'ລ໋ອກໄດ້',   badgeCls:'lv-SN'   },
  { id:'N',    code:'N',    desc:'Rally ໄວ', badgeCls:'lv-N'    },
  { id:'P',    code:'P',    desc:'ອາຊີບ',    badgeCls:'lv-P'    },
  { id:'GD',   code:'GD',   desc:'God',      badgeCls:'lv-GD'   }
];
// Map BG+ id back to the stored string "BG ProMax"
var ID_TO_VALUE = {
  'BG':'BG','BGPM':'BG ProMax','S-':'S-',
  'S':'S','SN':'SN','N':'N','P':'P','GD':'GD'
};

/* ───────────────── RANGE SELECTOR ───────────────── */
var rangeStart = -1, rangeEnd = -1;

function buildLevelRail() {
  var rail = document.getElementById('lvRail');
  rail.innerHTML = '';
  LEVELS.forEach(function(lv, i) {
    var chip = document.createElement('div');
    chip.className = 'lv-chip';
    chip.setAttribute('data-idx', i);
    chip.innerHTML = '<span class="lc-code">' + lv.code + '</span><span class="lc-desc">' + lv.desc + '</span>';
    chip.addEventListener('click', function() { handleLvClick(i); });
    rail.appendChild(chip);
  });
  updateRailUI();
}

function handleLvClick(idx) {
  if (rangeStart === -1 || (rangeStart !== -1 && rangeEnd !== -1)) {
    // First tap: set start
    rangeStart = idx; rangeEnd = -1;
  } else {
    // Second tap: set end (order doesn't matter)
    rangeEnd = idx;
    if (rangeEnd < rangeStart) { var t=rangeStart; rangeStart=rangeEnd; rangeEnd=t; }
  }
  updateRailUI();
}

function updateRailUI() {
  var chips = document.querySelectorAll('#lvRail .lv-chip');
  var lo = Math.min(rangeStart, rangeEnd === -1 ? rangeStart : rangeEnd);
  var hi = Math.max(rangeStart, rangeEnd === -1 ? rangeStart : rangeEnd);

  chips.forEach(function(chip, i) {
    chip.classList.remove('lv-endpoint','lv-in-range');
    if (rangeStart === -1) return;
    if (i === lo || i === hi) chip.classList.add('lv-endpoint');
    else if (i > lo && i < hi) chip.classList.add('lv-in-range');
  });

  // Label
  var lbl = document.getElementById('lvRangeLabel');
  if (rangeStart === -1) { lbl.textContent = 'ກົດເລືອກ'; return; }
  if (rangeEnd === -1) {
    lbl.textContent = LEVELS[rangeStart].code + ' (ກົດອີກໄລໜຶ່ງ)';
  } else {
    if (lo === hi) lbl.textContent = LEVELS[lo].code;
    else lbl.textContent = LEVELS[lo].code + ' - ' + LEVELS[hi].code;
  }
}

function getSelectedLevelsString() {
  if (rangeStart === -1) return '';
  var lo = rangeStart;
  var hi = rangeEnd === -1 ? rangeStart : rangeEnd;
  if (lo > hi) { var t=lo; lo=hi; hi=t; }
  return LEVELS.slice(lo, hi+1).map(function(l) { return ID_TO_VALUE[l.id]; }).join(', ');
}

/* ───────────────── BADGE HELPER ───────────────── */
function levelBadges(lvStr) {
  if (!lvStr) return '';
  return lvStr.split(',').map(function(s) {
    s = s.trim();
    var found = LEVELS.find(function(l) { return ID_TO_VALUE[l.id] === s || l.id === s; });
    var cls = found ? found.badgeCls : 'lv-BG';
    return '<span class="lv-badge ' + cls + '">' + s + '</span>';
  }).join(' ');
}

/* ───────────────── TOAST ───────────────── */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2600);
}

/* ───────────────── TAB SWITCH ───────────────── */
function switchTab(tab) {
  var d = document.getElementById('postDate');
  var today = new Date().toISOString().split('T')[0];
  if (d && !d.value) { d.value = today; d.min = today; }

  if (tab === 'map') {
    document.getElementById('mapPage').style.display = 'block';
    document.getElementById('postPage').classList.remove('active');
    document.getElementById('tabMap').classList.add('active');
    document.getElementById('tabPost').classList.remove('active');
    setTimeout(function(){ if(map) map.invalidateSize(); }, 120);
  } else {
    document.getElementById('mapPage').style.display = 'none';
    document.getElementById('postPage').classList.add('active');
    document.getElementById('tabPost').classList.add('active');
    document.getElementById('tabMap').classList.remove('active');
    populateCourtDropdown();
    loadFeed();
  }
}

/* ───────────────── SIDEBAR ───────────────── */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function applySidebarFilter() {
  selectedProvince = document.getElementById('provinceSelect').value;
  filterAndDisplay(); toggleSidebar();
}

/* ───────────────── MAP INIT (Google Maps — Hybrid Satellite) ───────────────── */
function initMap() {
  try {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 17.9634, lng: 102.6132 },
      zoom: 13,
      mapTypeId: google.maps.MapTypeId.HYBRID,
      // mapId not needed — using classic google.maps.Marker with custom SVG icon
      disableDefaultUI: true,
      gestureHandling: 'greedy'
      // HYBRID: satellite imagery, POI minimal by default — no styles needed
    });
    infoWindow = new google.maps.InfoWindow();
    map.addListener('click', resetFilterAndDisplay);
    // Classic Marker — no library needed, load data immediately
    loadData();

/* ───────────────── GEOLOCATION ───────────────── */
function getLocation() {
  if (!navigator.geolocation) { showToast("ບຣາວເຊີບໍ່ຮອງຮັບ GPS"); return; }
  navigator.geolocation.getCurrentPosition(function(p) {
    var pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (userMarker) {
      userMarker.setPosition(pos);
    } else {
      userMarker = new google.maps.Marker({
        position: pos, map: map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: '#1d6aff', fillOpacity: 1,
          strokeColor: '#ffffff', strokeWeight: 3
        },
        title: "ຕຳແໜ່ງຂອງທ່ານ",
        zIndex: 999
      });
    }
    map.panTo(pos);
    map.setZoom(16);
  }, function(){ showToast("ກະລຸນາເປີດ GPS ກ່ອນ"); }, { enableHighAccuracy:true });
}

/* ───────────────── GAS API CONFIG ───────────────── */
// *** ປ່ຽນ URL ນີ້ຫຼັງຈາກ deploy GAS ເປັນ Web App ***
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxJnH63l5oAEnaVo4jnn0KskGyzfCmYfzQDwYzYC9qdYym39rrzYBcI4-wUeVCdZhca/exec';

/* ───────────────── JSONP helper (GET) ───────────────── */
// JSONP bypass CORS ໄດ້ ເພາະໃຊ້ <script> tag ແທນ fetch()
// GAS doGet ຕ້ອງ return: callback(jsonData)
var _cbCounter = 0;
function _gasCall(params) {
  // Single JSONP helper used for ALL calls (GET and POST-via-GET)
  return new Promise(function(resolve, reject) {
    var cbName = '_cb' + (++_cbCounter) + '_' + Date.now();
    var script;

    var timeout = setTimeout(function() {
      if (window[cbName]) delete window[cbName];
      if (script && script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('ຄຳຮ້ອງ timeout — ກວດ GAS URL ຫຼື internet'));
    }, 25000);

    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      if (script && script.parentNode) script.parentNode.removeChild(script);
      // GAS may return {error: ...} or valid data
      if (data && data.error) reject(new Error(data.error));
      else resolve(data);
    };

    script = document.createElement('script');
    script.src = GAS_URL + '?' + params + '&callback=' + cbName + '&t=' + Date.now();
    script.onerror = function() {
      clearTimeout(timeout);
      if (window[cbName]) delete window[cbName];
      reject(new Error('ໂຫຼດ script ຜິດພາດ — ກວດ GAS URL ຫຼື network'));
    };
    document.head.appendChild(script);
  });
}

function _gasGet(action) {
  return _gasCall('action=' + encodeURIComponent(action));
}

/* ───────────────── JSONP POST helper ───────────────── */
// ໃຊ້ JSONP GET ສຳລັບທຸກ action (GET ແລະ POST)
// GAS doGet ຕ້ອງ handle action=savePost, action=verifyAndDelete ດ້ວຍ
// ວິທີນີ້ reliable ກວ່າ iframe form ເພາະ GAS ຕອບ callback ໂດຍກົງ
function _gasPost(body) {
  var params = 'action=' + encodeURIComponent(body.action || '');
  if (body.post)                   params += '&payload=' + encodeURIComponent(JSON.stringify(body.post));
  if (body.rowIndex !== undefined) params += '&rowIndex=' + body.rowIndex;
  if (body.code)                   params += '&code=' + encodeURIComponent(body.code);
  return _gasCall(params);
}

/* ───────────────── GO TO COURT FROM FEED (Google Maps) ───────────────── */
function goToCourtOnMap(courtName) {
  var found = -1;
  for (var i=0;i<allCourts.length;i++){
    if ((allCourts[i][0]||'').toString().trim()===courtName.trim()){ found=i; break; }
  }
  switchTab('map');
  if (found !== -1) {
    var lat=Number(allCourts[found][5]), lng=Number(allCourts[found][6]);
    setTimeout(function(){
      if (!isNaN(lat)&&!isNaN(lng)&&lat!==0){
        map.panTo({lat:lat,lng:lng});
        map.setZoom(16);
      }
      showSingleCourt(found);
      // Open infoWindow on the matching marker
      var mk = markers.find(function(m){
        var p = m.getPosition();
        if (!p) return false;
        return Math.abs(p.lat()-lat)<0.0001 && Math.abs(p.lng()-lng)<0.0001;
      });
      if (mk && infoWindow) {
        infoWindow.setContent(
          '<div style="font-family:system-ui,sans-serif;padding:4px 2px;">'+
          '<b style="font-size:13px;">'+(allCourts[found][0]||'')+'</b>'+
          '<p style="font-size:11px;color:#6b7280;margin:2px 0 0;">'+(allCourts[found][1]||'')+'</p>'+
          '</div>'
        );
        infoWindow.open(map, mk);
      }
      var c=document.getElementById('court-card-'+found);
      if(c) c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    },300);
  }
}

/* ───────────────── SUBMIT POST ───────────────── */
function submitPost() {
  var nameEl  = document.getElementById('postName');
  var phoneEl = document.getElementById('whatsappNumber');
  var dateEl  = document.getElementById('postDate');
  var startEl = document.getElementById('startTime');

  if (!nameEl.value.trim())     { showToast("ກະລຸນາໃສ່ຊື່"); return; }
  if (phoneEl.value.length < 8) { showToast("ກະລຸນາໃສ່ເບີ 8 ຕົວ"); return; }
  if (!dateEl.value)            { showToast("ກະລຸນາເລືອກວັນທີ"); return; }
  if (!startEl.value)           { showToast("ກະລຸນາໃສ່ໂມງເລີ່ມ"); return; }

  var lvStr = getSelectedLevelsString();
  if (!lvStr) { showToast("ກະລຸນາເລືອກລະດັບມື"); return; }

  // Auto-prefix 85620 for Lao WA
  var fullPhone = '85620' + phoneEl.value;

  var post = {
    name:      nameEl.value.trim(),
    whatsapp:  fullPhone,          // stored as 85620xxxxxxxx
    courtName: document.getElementById('selectCourt').value,
    level:     lvStr,
    people:    document.getElementById('peopleCount').value,
    startTime: startEl.value,
    endTime:   document.getElementById('endTime').value,
    postDate:  dateEl.value
  };

  // Disable button while submitting
  var btn = document.querySelector('.btn-blue[onclick="submitPost()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'ກຳລັງສົ່ງ...'; }

  _gasPost({ action: 'savePost', post: post })
    .then(function(res) {
      if (res.error) { showToast("ຜິດພາດ: " + res.error); return; }

      // Extract deleteCode — handle both response shapes from GAS
      // doGet returns: { success: true, deleteCode: "123" }
      // fallback: res itself may be the code string
      var code = res.deleteCode || res.code || (typeof res === 'string' ? res : null);
      if (code) {
        showDeleteCodeBanner(code);
      } else {
        showToast("ປະກາດສຳເລັດ!");
      }

      // Clear form fields
      document.getElementById('postName').value = '';
      document.getElementById('whatsappNumber').value = '';
      document.getElementById('peopleCount').value = '';
      document.getElementById('startTime').value = '';
      document.getElementById('endTime').value = '';
      rangeStart = -1; rangeEnd = -1; updateRailUI();

      // Auto-refresh feed immediately
      loadFeed();
    })
    .catch(function(err){
      showToast("ຜິດພາດ: " + (err && err.message ? err.message : err));
    })
    .finally(function() {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i>&nbsp; ປະກາດ'; }
    });
}

}

/* ───────────────── LOAD FEED ───────────────── */
function loadFeed() {
  var container=document.getElementById('feedContainer');
  if(!container) return;
  container.innerHTML='<div class="spinner"></div>';

  _gasGet('getPosts')
    .then(function(posts) {
      if (!posts||posts.length===0) {
        container.innerHTML='<div class="g-card"><div class="empty-st"><i class="fas fa-users-slash"></i><p>ຍັງບໍ່ມີປະກາດ — ເປັນຄົນທຳອິດ!</p></div></div>';
        return;
      }
      container.innerHTML = posts.slice().reverse().map(function(p) {
        var phone=(p.whatsapp||'').toString().replace(/[^0-9]/g,'');
        var timeStr=(p.startTime&&p.endTime)?p.startTime+' - '+p.endTime:(p.startTime||'--:--');
        var courtEsc=(p.courtName||'').replace(/'/g,"\\'");
        return (
          '<div class="g-card feed-card">'+
            '<button class="feed-court-btn" onclick="goToCourtOnMap(\''+courtEsc+'\')">'+
              '<i class="fas fa-location-dot" style="color:#ff3b30;font-size:13px;"></i>'+
              (p.courtName||'ບໍ່ລະບຸ')+
            '</button>'+
            '<div class="feed-meta">'+
              '<span><i class="fas fa-user"></i>'+(p.name||'-')+'</span>'+
              '<span><i class="fas fa-calendar-days"></i>'+(p.postedDate||'-')+'</span>'+
              '<span><i class="fas fa-clock"></i>'+timeStr+'</span>'+
              '<span><i class="fas fa-user-plus"></i>+'+(p.people||'?')+' ຄົນ</span>'+
            '</div>'+
            '<div class="feed-badges">'+levelBadges(p.level)+'</div>'+
            '<div class="feed-actions">'+
              '<a href="https://wa.me/'+phone+'?text='+encodeURIComponent('Hi ສົນໃຈໄປຕີຢູ່ '+(p.courtName||''))+'" target="_blank" class="wa-btn">'+
                '<i class="fa-brands fa-whatsapp" style="font-size:16px;"></i> ທັກ WhatsApp'+
              '</a>'+
              '<button class="del-btn" onclick="confirmDelete('+p.rowIndex+')" title="ລົບ"><i class="fas fa-trash-can"></i></button>'+
            '</div>'+
          '</div>'
        );
      }).join('');
    })
    .catch(function() {
      container.innerHTML='<div class="g-card"><div class="empty-st"><i class="fas fa-triangle-exclamation"></i><p>ໂຫຼດບໍ່ສຳເລັດ</p></div></div>';
    });
}

/* ───────────────── DELETE ───────────────── */
function confirmDelete(rowIndex) {
  var code=prompt("[Code] ໃສ່ລະຫັດລົບໂພສ:");
  if(!code||!code.trim()) return;
  _gasPost({ action: 'verifyAndDelete', rowIndex: rowIndex, code: code.trim().toUpperCase() })
    .then(function(res) {
      if (res.success) { showToast("ລົບສຳເລັດ"); loadFeed(); }
      else { showToast("[X] " + (res.message || 'ຜິດພາດ')); }
    })
    .catch(function(){ showToast("ເຊື່ອມຕໍ່ຜິດພາດ"); });
}

/* ───────────────── INIT ───────────────── */
window.onload = function() {
  buildLevelRail();
  // initMap() called by Google Maps &callback= — it calls loadData() internally
  loadFeed();
  var today=new Date().toISOString().split('T')[0];
  var d=document.getElementById('postDate');
  if(d){ d.value=today; d.min=today; }
};
</script>
  <!-- Google Maps API — callback=initMap so map starts after API loads -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCvItAs5UNfCTEyhsaWXE4WI7XxibaQpDE&loading=async&callback=initMap" async defer></script>
